name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    # 插件优先支持 Windows 桌面宿主，CI 与主要使用环境保持一致
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [22]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Syntax check
        shell: pwsh
        run: |
          node --check lib/state.js
          node --check lib/index.js
          node --check client/client.js
          node --check scripts/test-host.mjs

      - name: Host contract tests
        shell: pwsh
        run: node scripts/test-host.mjs

      - name: Client bundle smoke
        shell: pwsh
        run: node scripts/test-client.mjs client/client.js

      - name: Client interaction tests
        shell: pwsh
        run: node scripts/test-client-interaction.mjs client/client.js

      - name: Install offscreen render deps
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'ph-render'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          Set-Content -Path (Join-Path $dir 'package.json') -Value '{"name":"ph-render","private":true}'
          npm install --prefix $dir react@18.3.1 react-dom@18.3.1 jsdom@24 --no-audit --no-fund

      - name: Real React + jsdom render tests
        shell: pwsh
        env:
          PH_RENDER_MODULES: ${{ runner.temp }}\ph-render
        run: node scripts/test-client-dom.mjs client/client.js
