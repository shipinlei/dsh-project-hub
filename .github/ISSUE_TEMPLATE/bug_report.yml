name: Bug 报告
description: 面板/侧栏/新建会话等功能异常
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        提交前请先确认：插件已按 README 安装、页面已刷新、`GET /dsh-project-hub/api/health` 可访问。
        **请勿粘贴 API Key、token、会话内容或完整本机路径。**
  - type: input
    id: dsh-version
    attributes:
      label: DSH 版本与发行形态
      placeholder: 0.2.2-rc.1 桌面版 / Web
    validations:
      required: true
  - type: input
    id: plugin-version
    attributes:
      label: 插件版本
      placeholder: 0.1.0
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: 操作系统
      placeholder: Windows 11 / macOS 15 / Ubuntu 24.04
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开侧栏「项目」
        2. 点击「新建会话」
        3. …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
    validations:
      required: true
  - type: textarea
    id: health
    attributes:
      label: /health 输出（已脱敏）
      description: 可只保留 client.registered / client.rev / memory / clientEvents.last
      render: json
  - type: textarea
    id: screenshots
    attributes:
      label: 截图或录屏
      description: 直接拖拽图片到此处
  - type: checkboxes
    id: confirm
    attributes:
      label: 确认
      options:
        - label: 已阅读 README 与已知限制，且不是重复 issue
          required: true
