name: 功能建议
description: 提出新功能或改进
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        先看看 [已知限制](https://github.com/<your-github-name>/dsh-project-hub#已知限制) 与 [设计结论](docs/设计结论.md)，避免重复。
        涉及跨项目移动会话、内置编辑器、项目级权限模式的建议，请先说明为什么必须突破现有边界。
  - type: textarea
    id: problem
    attributes:
      label: 要解决什么问题
      description: 描述使用场景与当前的痛点，而不是先给方案
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望的方案
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
  - type: checkboxes
    id: constraints
    attributes:
      label: 约束确认
      options:
        - label: 方案不需要修改 DSH 核心包或替换官方侧栏
        - label: 方案不需要引入构建链或额外前端依赖
